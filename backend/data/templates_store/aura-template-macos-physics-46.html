    <script>
      document.addEventListener('DOMContentLoaded', () => {
          const container = document.getElementById('desktop');
          const items = document.querySelectorAll('.physics-item');
          const dock = document.getElementById('dock');
          const menubar = document.getElementById('menubar');

          // Physics settings
          const gravity = 0.4;
          const friction = 0.98;
          const groundFriction = 0.92;
          const bounce = 0.65;

          let bounds = { top: 0, bottom: 0, left: 0, right: 0 };

          function updateBounds() {
              const dockRect = dock.getBoundingClientRect();
              bounds = {
                  top: menubar.offsetHeight,
                  bottom: dockRect.top - 10,
                  left: 0,
                  right: window.innerWidth
              };
          }

          window.addEventListener('resize', updateBounds);
          updateBounds();

          const bodies = [];

          function initBody(el, isNew = false) {
              const customRadius = el.getAttribute('data-radius');
              const radius = customRadius ? parseFloat(customRadius) : 32;
              const mass = parseFloat(el.getAttribute('data-mass') || 1);

              const body = {
                  el,
                  x: isNew ? (bounds.right / 2) + (Math.random() * 40 - 20) : Math.random() * (bounds.right - radius * 2) + radius,
                  y: isNew ? bounds.top + 40 : Math.random() * (bounds.bottom - bounds.top - 200) + bounds.top + 50,
                  vx: isNew ? (Math.random() - 0.5) * 10 : (Math.random() - 0.5) * 15,
                  vy: isNew ? Math.random() * 5 : (Math.random() - 0.5) * 5,
                  radius,
                  mass,
                  isDragging: false,
                  dragOffsetX: 0,
                  dragOffsetY: 0
              };
              bodies.push(body);
              return body;
          }

          Array.from(items).forEach(el => initBody(el, false));

          // Clear function for settings
          function clearItems(type) {
              for (let i = bodies.length - 1; i >= 0; i--) {
                  if (bodies[i].el.getAttribute('data-type') === type) {
                      bodies[i].el.remove();
                      bodies.splice(i, 1);
                  }
              }
          }

          const spawner = document.getElementById('spawner-app');
          if (spawner) {
              spawner.addEventListener('click', () => {
                  const isVirus = Math.random() < 0.2;

                  const newItem = document.createElement('div');
                  newItem.className = 'physics-item absolute top-0 left-0 w-16 flex flex-col items-center gap-1 cursor-grab active:cursor-grabbing pointer-events-auto group';

                  if (isVirus) {
                      newItem.setAttribute('data-mass', '1.5');
                      newItem.setAttribute('data-type', 'virus');
                      newItem.innerHTML = '<div class="w-14 h-14 bg-red-900/80 backdrop-blur-md rounded-2xl flex items-center justify-center border border-red-500 shadow-lg shadow-red-500/50 group-hover:bg-red-800 transition-colors duration-200 animate-pulse"><iconify-icon icon="solar:danger-triangle-linear" class="text-3xl text-red-200" stroke-width="1.5"></iconify-icon></div><span class="text-xs font-bold text-red-400 drop-shadow-md text-center leading-tight">VIRUS.exe</span>';
                      const toast = document.createElement('div');
                      toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 bg-red-500/90 backdrop-blur-md text-white px-5 py-2 rounded-full font-bold shadow-lg z-[200] transition-opacity duration-500 pointer-events-none flex items-center gap-2 border border-red-400';
                      toast.innerHTML = '<iconify-icon icon="solar:danger-triangle-bold" class="text-lg"></iconify-icon> Virus Spawned!';
                      document.body.appendChild(toast);
                      setTimeout(() => {
                          toast.style.opacity = '0';
                          setTimeout(() => toast.remove(), 500);
                      }, 2500);
                  } else {
                      newItem.setAttribute('data-mass', '1');
                      newItem.setAttribute('data-type', 'file');
                      newItem.innerHTML = '<div class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 shadow-lg shadow-black/20 group-hover:bg-white/20 transition-colors duration-200"><iconify-icon icon="solar:file-text-linear" class="text-3xl text-emerald-300" stroke-width="1.5"></iconify-icon></div><span class="text-xs font-medium drop-shadow-md text-center leading-tight">File_' + Math.floor(Math.random()*1000) + '</span>';
                  }

                  container.appendChild(newItem);
                  initBody(newItem, true);
              });
          }

          const bombSpawner = document.getElementById('spawner-bomb');
          if (bombSpawner) {
              bombSpawner.addEventListener('click', () => {
                  const bombItem = document.createElement('div');
                  bombItem.className = 'physics-item absolute top-0 left-0 w-16 flex flex-col items-center gap-1 cursor-grab active:cursor-grabbing pointer-events-auto group';
                  bombItem.setAttribute('data-mass', '2');
                  bombItem.setAttribute('data-type', 'bomb');
                  bombItem.innerHTML = '<div class="w-14 h-14 bg-orange-900/80 backdrop-blur-md rounded-2xl flex items-center justify-center border border-orange-500 shadow-lg shadow-orange-500/50 group-hover:bg-orange-800 transition-colors duration-200 animate-pulse"><iconify-icon icon="solar:bomb-minimalistic-bold" class="text-3xl text-orange-200"></iconify-icon></div><span class="text-xs font-bold text-orange-400 drop-shadow-md text-center leading-tight">BOMB</span>';
                  container.appendChild(bombItem);
                  const bombBody = initBody(bombItem, true);

                  setTimeout(() => {
                      if (!bombItem.parentNode) return; // In case it was cleared via settings
                      
                      const explosion = document.createElement('div');
                      explosion.className = 'absolute rounded-full bg-orange-500/80 blur-xl transition-all duration-300 pointer-events-none z-[200]';
                      explosion.style.left = (bombBody.x - 150) + 'px';
                      explosion.style.top = (bombBody.y - 150) + 'px';
                      explosion.style.width = '300px';
                      explosion.style.height = '300px';
                      explosion.style.transform = 'scale(0.1)';
                      container.appendChild(explosion);

                      explosion.getBoundingClientRect();
                      explosion.style.transform = 'scale(2.5)';
                      explosion.style.opacity = '0';
                      setTimeout(() => explosion.remove(), 300);

                      const forceMultiplier = 1500;
                      bodies.forEach(b => {
                          if (b !== bombBody) {
                              const dx = b.x - bombBody.x;
                              const dy = b.y - bombBody.y;
                              const dist = Math.sqrt(dx * dx + dy * dy);
                              if (dist < 600 && dist > 0) {
                                  const force = forceMultiplier / (dist * 0.5);
                                  b.vx += (dx / dist) * force;
                                  b.vy += (dy / dist) * force - 25;
                              }
                          }
                      });

                      bombItem.remove();
                      const index = bodies.indexOf(bombBody);
                      if (index > -1) bodies.splice(index, 1);
                  }, 2000);
              });
          }

          const waterSpawner = document.getElementById('spawner-water');
          if (waterSpawner) {
              waterSpawner.addEventListener('click', () => {
                  for (let i = 0; i < 40; i++) {
                      setTimeout(() => {
                          const drop = document.createElement('div');
                          drop.className = 'physics-item absolute top-0 left-0 w-8 flex flex-col items-center gap-1 cursor-grab active:cursor-grabbing pointer-events-auto group';
                          drop.setAttribute('data-mass', '0.4');
                          drop.setAttribute('data-radius', '12');
                          drop.setAttribute('data-type', 'water');
                          drop.innerHTML = '<div class="w-6 h-6 bg-cyan-400/60 backdrop-blur-md rounded-full flex items-center justify-center border border-cyan-200 shadow-md shadow-cyan-500/40"></div>';
                          container.appendChild(drop);
                          const dropBody = initBody(drop, true);
                          dropBody.x = bounds.left + 20;
                          dropBody.y = bounds.top + 50 + Math.random() * 150;
                          dropBody.vx = 20 + Math.random() * 15;
                          dropBody.vy = -5 + Math.random() * 10;
                      }, i * 20);
                  }

                  bodies.forEach(b => {
                      b.vx += 15 + Math.random() * 10;
                      b.vy -= 10 + Math.random() * 5;
                  });
              });
          }

          let activeBody = null;
          let mouseX = 0;
          let mouseY = 0;
          let lastMouseX = 0;
          let lastMouseY = 0;

          document.addEventListener('pointerdown', (e) => {
              const target = e.target.closest('.physics-item');
              if (target) {
                  activeBody = bodies.find(b => b.el === target);
                  if (activeBody) {
                      activeBody.isDragging = true;
                      activeBody.vx = 0;
                      activeBody.vy = 0;

                      activeBody.dragOffsetX = e.clientX - activeBody.x;
                      activeBody.dragOffsetY = e.clientY - activeBody.y;

                      activeBody.el.style.zIndex = 100;
                      target.setPointerCapture(e.pointerId);

                      mouseX = e.clientX;
                      mouseY = e.clientY;
                      lastMouseX = e.clientX;
                      lastMouseY = e.clientY;
                  }
              }
          });

          document.addEventListener('pointermove', (e) => {
              mouseX = e.clientX;
              mouseY = e.clientY;

              if (activeBody) {
                  activeBody.x = mouseX - activeBody.dragOffsetX;
                  activeBody.y = mouseY - activeBody.dragOffsetY;

                  activeBody.vx = mouseX - lastMouseX;
                  activeBody.vy = mouseY - lastMouseY;

                  lastMouseX = mouseX;
                  lastMouseY = mouseY;
              }
          });

          document.addEventListener('pointerup', (e) => {
              if (activeBody) {
                  activeBody.isDragging = false;
                  activeBody.el.style.zIndex = '';
                  try { activeBody.el.releasePointerCapture(e.pointerId); } catch(err){}
                  activeBody = null;
              }
          });

          document.addEventListener('touchstart', (e) => {
              if (e.target.closest('.physics-item')) e.preventDefault();
          }, { passive: false });

          // Settings App Logic
          const settingsWindow = document.getElementById('settings-window');
          
          document.getElementById('app-settings').addEventListener('click', () => {
              settingsWindow.classList.remove('hidden');
              settingsWindow.classList.add('flex');
          });

          document.getElementById('close-settings').addEventListener('click', () => {
              settingsWindow.classList.add('hidden');
              settingsWindow.classList.remove('flex');
          });

          // Wallpaper Change Logic
          const baseBodyClasses = 'h-screen w-screen overflow-hidden text-slate-100 select-none touch-none transition-colors duration-500';
          document.querySelectorAll('.wallpaper-btn').forEach(btn => {
              btn.addEventListener('click', (e) => {
                  const bg = e.target.getAttribute('data-bg');
                  document.getElementById('body-container').className = `${bg} ${baseBodyClasses}`;
              });
          });

          // Cleanup Button Actions
          document.getElementById('clear-files').addEventListener('click', () => {
              clearItems('file');
              clearItems('virus');
          });
          document.getElementById('clear-water').addEventListener('click', () => clearItems('water'));
          document.getElementById('clear-bombs').addEventListener('click', () => clearItems('bomb'));

          function resolveCollision(b1, b2) {
              const dx = b2.x - b1.x;
              const dy = b2.y - b1.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              const minDistance = b1.radius + b2.radius;

              if (distance < minDistance) {
                  const overlap = minDistance - distance;
                  const nx = distance === 0 ? 1 : dx / distance;
                  const ny = distance === 0 ? 0 : dy / distance;

                  const sepX = nx * (overlap / 2.05);
                  const sepY = ny * (overlap / 2.05);

                  if (!b1.isDragging) { b1.x -= sepX; b1.y -= sepY; }
                  if (!b2.isDragging) { b2.x += sepX; b2.y += sepY; }

                  const kx = (b1.vx - b2.vx);
                  const ky = (b1.vy - b2.vy);
                  const p = 2.0 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

                  if (!b1.isDragging) {
                      b1.vx = b1.vx - p * b2.mass * nx * bounce;
                      b1.vy = b1.vy - p * b2.mass * ny * bounce;
                  }
                  if (!b2.isDragging) {
                      b2.vx = b2.vx + p * b1.mass * nx * bounce;
                      b2.vy = b2.vy + p * b1.mass * ny * bounce;
                  }
              }
          }

          function update() {
              for (let i = 0; i < bodies.length; i++) {
                  const b = bodies[i];

                  if (!b.isDragging) {
                      b.vy += gravity;

                      b.x += b.vx;
                      b.y += b.vy;

                      b.vx *= friction;
                      b.vy *= friction;

                      if (b.y + b.radius > bounds.bottom) {
                          b.y = bounds.bottom - b.radius;
                          b.vy *= -bounce;
                          b.vx *= groundFriction;
                      } else if (b.y - b.radius < bounds.top) {
                          b.y = bounds.top + b.radius;
                          b.vy *= -bounce;
                      }

                      if (b.x + b.radius > bounds.right) {
                          b.x = bounds.right - b.radius;
                          b.vx *= -bounce;
                      } else if (b.x - b.radius < bounds.left) {
                          b.x = bounds.left + b.radius;
                          b.vx *= -bounce;
                      }
                  }

                  for (let j = i + 1; j < bodies.length; j++) {
                      resolveCollision(b, bodies[j]);
                  }

                  b.el.style.transform = 'translate3d(' + (b.x - b.radius) + 'px, ' + (b.y - b.radius) + 'px, 0)';
              }

              requestAnimationFrame(update);
          }

          update();
      });
    </script>
  
</body></html>
