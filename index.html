<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REPASS AI — Plataforma OSINT & Motor Agêntico de Sites 3D</title>
    <meta name="description" content="REPASS AI é a plataforma agêntica líder para varredura OSINT de leads locais, enriquecimento via Places API e geração autônoma de sites 3D." />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    
    <!-- OpenGraph SEO -->
    <meta property="og:title" content="REPASS AI — OSINT Lead Scanner & Site Builder" />
    <meta property="og:description" content="Prospecte negócios locais e crie sites em segundos com Inteligência Artificial Agêntica." />
    <meta property="og:type" content="website" />
    
    <!-- Script Anti-Flash de Tema (Sem FOTU / Sem piscar tela) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('repass_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Inter Tight, JetBrains Mono, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #05070f; color: #ffffff; margin: 0;">
    
    <!-- Filtro SVG Glassmorphism Distortion (#glass-distortion) extraído da UseLeadSite -->
    <svg style="display: none;" aria-hidden="true">
      <defs>
        <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feBlend in="SourceGraphic" in2="displaced" mode="overlay" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
