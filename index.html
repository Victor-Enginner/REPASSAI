<!DOCTYPE html>
<!--
  data-theme parte em "light", o padrão da marca, e theme-init.js troca
  para o tema salvo antes do primeiro pixel. Estava fixo em "dark" aqui:
  se o script falhasse, a página inteira ficava escura contra a
  identidade — e o valor divergia do padrão do React.
-->
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP. Duas correções em relação à versão anterior:

      1. `frame-src 'self'` bloqueava o preview da Loja de Templates. O
         preview é um <iframe> apontando para /api/templates/preview no
         BACKEND, que é outra origem — os cartões vinham em branco.

      2. `connect-src` listava http://localhost:8000 literal. Isso vale na
         máquina do dev e derruba a API inteira em produção, onde o
         backend tem outro domínio.

      %VITE_API_BASE% SAIU do connect-src e do frame-src.

      O Vite agora encaminha `/api` para o backend (vite.config.js), do mesmo
      jeito que o nginx faz em produção. Com isso o app fala com a API na
      MESMA origem nos dois ambientes, e `'self'` já cobre tudo — a variável
      virou supérflua.

      E era uma armadilha: quando o valor é `/` (relativo, o padrão de
      produção), o CSP saía como `connect-src 'self' /`, e `/` não é uma
      fonte válida. Pior no Windows, onde o Git Bash converte o `/` do
      argumento em `C:/Program Files/Git/` e o cabeçalho ia para o HTML com
      um caminho de disco dentro. Aconteceu de verdade, no build de 14/08.
    -->
    <!--
      DUAS CORREÇÕES, ambas vindas de erro real no console:

      1. `frame-ancestors` SAIU daqui. Ele é ignorado quando entregue por
         <meta> — o próprio navegador avisava isso a cada carregamento, e a
         proteção contra clickjacking NÃO estava valendo, nem em produção.
         Diretiva que só funciona como cabeçalho HTTP passou para vercel.json,
         onde de fato vale. Manter aqui só produzia ruído e falsa segurança.

      2. `worker-src 'self' blob:` ENTROU. Sem ele o navegador bloqueava
         "Creating a worker from 'blob:...' violates script-src 'self'":
         bibliotecas de efeito (a `postprocessing`, por exemplo) embutem o
         worker no próprio pacote e o instanciam por blob. Sem `worker-src`,
         o navegador cai no `script-src` e recusa.

         É a permissão MÍNIMA para isso: autoriza worker a partir de blob que
         a própria página cria, sem afrouxar `script-src` para scripts —
         script de outro domínio continua bloqueado.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' ws://localhost:3000 ws://127.0.0.1:3000 ws://localhost:5173 wss:; frame-src 'self' blob:; upgrade-insecure-requests" />
    <title>REPASS AI — Plataforma OSINT & Motor Agêntico de Sites 3D</title>
    <meta name="description" content="REPASS AI é a plataforma agêntica líder para varredura OSINT de leads locais, enriquecimento via Places API e geração autônoma de sites 3D." />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    
    <!-- OpenGraph SEO -->
    <meta property="og:title" content="REPASS AI — OSINT Lead Scanner & Site Builder" />
    <meta property="og:description" content="Prospecte negócios locais e crie sites em segundos com Inteligência Artificial Agêntica." />
    <meta property="og:type" content="website" />
    
    <!-- Script Anti-Flash de Tema (Sem FOTU / Sem piscar tela) -->
    <script src="/theme-init.js"></script>

    <!--
      Tipografia da marca: Geist (headline + corpo) e Geist Mono (rótulos).
      Inter Tight / Inter / JetBrains Mono ficam como fallback declarado nas
      variáveis de fonte — se o Google Fonts falhar, o layout não colapsa
      para a serifada do sistema.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@500;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <!--
    Sem style inline aqui, de propósito: o atributo `style` vence qualquer
    regra da folha por especificidade e travaria o fundo num tema só.
    A cor de partida é pintada no <html> por theme-init.js, conforme o
    tema salvo, e o CSS assume assim que carrega.
  -->
  <body style="margin: 0;">
    
    <!-- Filtro SVG Glassmorphism Distortion (#glass-distortion) extraído da UseLeadSite -->
    <svg style="display: none;" aria-hidden="true">
      <defs>
        <filter id="glass-distortion" x="-10%" y="-10%" width="120%" height="120%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feBlend in="SourceGraphic" in2="displaced" mode="overlay" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
