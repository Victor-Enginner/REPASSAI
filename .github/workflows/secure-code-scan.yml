name: Secure Code Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  white-box:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run secure-code scanner
        run: bash scripts/secure-code/scan.sh .
