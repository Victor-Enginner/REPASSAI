name: Secure Code Scan

on:
  pull_request:
  push:
    branches:
      # Estava `main`, branch que NÃO existe neste repositório — o scan nunca
      # rodou num push, só em pull request. Os branches reais são `master` e
      # os de trabalho `codex/*`; ambos entram, senão o trabalho fica sem
      # verificação até a hora do merge.
      - master
      - 'codex/**'

permissions:
  contents: read

jobs:
  white-box:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run secure-code scanner
        run: bash scripts/secure-code/scan.sh .
