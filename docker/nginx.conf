server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"repass-frontend"}';
    }

    # SSE precisa permanecer sem buffer para os pulsos chegarem em tempo real.
    location = /api/logs/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 300s, não 120s. Uma varredura de 6 nichos pelo OpenStreetMap levou
        # 54 segundos medidos, e o servidor público da Overpass fica lento em
        # horário cheio — com três espelhos em cadeia, o pior caso passa de
        # 120s. Estourar aqui devolveria 504 ao operador com a varredura ainda
        # rodando no backend: ele veria erro e o trabalho teria acontecido.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 1m não comporta o schema de um site com muitos componentes, e o
        # editor salva o schema inteiro a cada versão. 5m dá folga sem virar
        # porta aberta para upload grande.
        client_max_body_size 5m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
